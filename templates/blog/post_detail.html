{% extends "common/base.html" %}

{% block title %}post_detail{% endblock title %}

{% block content %}
<h1> {{post.title}} </h1>
<p class="date">
    published {{ post.publish }} by {{ post.author }}
</p>
{{ post.body|linebreaks}}
<p>
    <a href="{% url 'blog:post_share' post.id %}">share this post</a>
</p>
{% endblock content %}
